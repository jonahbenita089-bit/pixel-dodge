<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BB Racing</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="game-wrap">
      <div class="top-bar">
        <div class="logo">BB RACING</div>
        <div class="scoreboard">
          <span>Score <strong id="score">0</strong></span>
          <span>Best <strong id="best">0</strong></span>
        </div>
      </div>

      <canvas id="gameCanvas" width="420" height="720" aria-label="BB Racing arcade game"></canvas>

      <div class="bottom-panel">
        <button id="startBtn">Start Race</button>
        <span class="hint">Steer with A / D or ← / →</span>
      </div>
    </div>

    <script src="game.js"></script>
  </body>
</html>
